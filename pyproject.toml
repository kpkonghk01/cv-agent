[project]
name = "cv-agent"
version = "0.1.0"
description = "A per-candidate pipeline that screens CVs against a JD and drafts interview material for those who pass."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    # Orchestration (used as a stateful workflow engine, not autonomous agents — see ADR 0004)
    "langgraph>=0.2",
    # OCR: Marker (force-OCR to bypass poisoned text layers) — see ADR 0001
    "marker-pdf>=1.0",
    # BYOK, OpenAI-compatible LLM access — see ADR 0002
    "openai>=1.40",
    # Domain models + structured-output validation
    "pydantic>=2.7",
    # JD meta files
    "pyyaml>=6.0",
    # .env config
    "python-dotenv>=1.0",
]

[project.scripts]
cv-agent = "cv_agent.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pytest-asyncio>=0.23",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cv_agent"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = [
    "slow: integration tests that load Marker/OCR models (excluded from the coverage gate)",
]

[tool.coverage.run]
source = ["cv_agent"]
# LLM semantics are checked by offline evals, not unit tests (see AGENT.md testing section)
omit = ["src/cv_agent/cli.py"]
